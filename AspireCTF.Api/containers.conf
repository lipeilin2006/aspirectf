# Nested podman (podman-in-podman) runtime config
[containers]
cgroup_manager = "cgroupfs"
events_backend = "file"
default_sysctls = ["net.ipv4.ip_forward=1", "net.ipv6.conf.all.forwarding=1"]
dns_servers = ["223.5.5.5", "119.29.29.29"]
# Nested cgroup v2 cannot enable the pids controller (crun: "pids is not available").
# pids_limit = 0 makes podman OMIT the pids controller from the OCI config entirely,
# so crun never tries to enable it and containers start normally.
# (pids_limit = -1 would emit pids.limit:-1 which still touches the controller and fails.)
pids_limit = 0

[engine]
cgroup_manager = "cgroupfs"
events_backend = "file"
runtime = "crun"
# Disable healthcheck and other systemd-dependent features.
image_copy_tmp_dir = "/var/tmp"

# Keep build intermediate layers: when only run-challenge.sh changes, only the
# COPY/CHMOD layers rebuild (full cold build with apt/opencode/pip takes ~12 min).
[build]
layers = true

[network]
default_network = "podman"
